spring:
  datasource:
    url: jdbc:h2:mem:commerce-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    # 4주차부터 실습 SQL을 확인하기 위해 로그를 출력한다.
    show-sql: true
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
