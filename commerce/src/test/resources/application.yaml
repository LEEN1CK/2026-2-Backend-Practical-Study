spring:
  datasource:
    url: jdbc:h2:mem:commerce-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    # 실습에서 실행되는 SQL을 확인하기 위해 로그를 출력한다.
    show-sql: true
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
        # TODO[W5-3]: 주문 항목을 10개씩 묶어서 조회하도록 Batch Size를 설정하세요.
